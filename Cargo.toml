[package]
name = "pdftrim"
version = "1.0.2"
edition = "2021"
description = "Removes white margins from PDF files without inflating file sizes"
repository = "https://github.com/ciffelia/pdftrim"
license = "MIT OR Apache-2.0"
keywords = ["pdf", "trim", "crop"]
categories = ["command-line-utilities"]
exclude = ["/.devcontainer", "/.github", "/.vscode", "/.gitignore"]

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
clap_complete = "4.5.58"
env_logger = { version = "0.11.8", default-features = false, features = [
  "auto-color",
  "humantime",
] }
log = "0.4.28"
lopdf = "0.38.0"
regex-lite = "0.1.7"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"

[build-dependencies]
clap = { version = "4.5.48", features = ["derive"] }
clap_complete = "4.5.58"
